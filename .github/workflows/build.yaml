name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'webui/**'
      - 'module/module.prop'
      - '.github/workflows/build.yaml'

env:
  MODULE_NAME: 'KPatch-Next-Module'
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_tag.outputs.version }}
      check_tag: ${{ steps.check_tag.outputs.need_release }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Load versions from version.properties
      run: |
        grep -v '^#' version.properties | sed -e 's/ *= */=/g' -e 's/"//g' >> $GITHUB_ENV

    - name: Checkout ABI-fixed EXP core
      uses: actions/checkout@v4
      with:
        repository: Zhanfg/KPatch-Next-EXP
        ref: main
        path: core
        submodules: recursive

    - name: Build patched KPIMG from this fork (never use the upstream KPIMG)
      shell: bash
      run: |
        set -euo pipefail
        curl -fL --retry 3 -o /tmp/arm-toolchain.tar.xz \
          https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
        mkdir -p /tmp/kp-toolchain
        tar -xJf /tmp/arm-toolchain.tar.xz -C /tmp/kp-toolchain --strip-components=1
        export TARGET_COMPILE=/tmp/kp-toolchain/bin/aarch64-none-elf-
        make -C core/kernel
        test -s core/kernel/kpimg
        "${TARGET_COMPILE}nm" -a core/kernel/kpimg.elf | grep -F '__kp_symbol_is_su_allow_uid'
        mkdir -p module/bin
        cp core/kernel/kpimg module/bin/kpimg
        printf 'Patched EXP core SHA: %s\n' "$(git -C core rev-parse HEAD)" > module/ABI-COMPAT-BUILD.txt
        printf 'Kernel, kptools and kpatch: compiled from Zhanfg/KPatch-Next-EXP main\n' >> module/ABI-COMPAT-BUILD.txt
        sha256sum module/bin/kpimg

    # Build the matching Android CLIs from the *same* core checkout as kpimg.
    # 0.13.14 is the latest EXP release, but its prebuilt kptools predates
    # main-branch symbol-resolution and patcher fixes.
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: android-ndk
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Build matching Android kptools and kpatch from EXP source
      shell: bash
      env:
        NDK_ROOT: ${{ steps.android-ndk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        export TARGET_COMPILE=placeholder
        make -C core/kernel hdr
        for tool in tools user; do
          cmake -S "core/$tool" -B "core/$tool/build/android" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_ABI=arm64-v8a
          cmake --build "core/$tool/build/android" -j 2
        done
        install -m 0755 core/tools/build/android/kptools module/bin/kptools
        install -m 0755 core/user/build/android/kpatch module/bin/kpatch
        file module/bin/kptools module/bin/kpatch
        "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h module/bin/kptools | grep -E 'Class:|Machine:'
        "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h module/bin/kpatch | grep -E 'Class:|Machine:'
        echo 'Android CLI source: Zhanfg/KPatch-Next-EXP main, same revision as kpimg' >> module/ABI-COMPAT-BUILD.txt
        sha256sum module/bin/kptools module/bin/kpatch module/bin/kpimg

    - name: Download magiskboot binary
      run: |
        TAG="${{ env.magiskboot }}"
        ARGS=("-R" "topjohnwu/Magisk" "-p" "Magisk*.apk" "-O" "magisk.apk")
        if [ "$TAG" != "latest" ]; then
          gh release download "$TAG" "${ARGS[@]}"
        else
          gh release download "${ARGS[@]}"
        fi
        unzip -p magisk.apk 'lib/arm64-v8a/libmagiskboot.so' > module/bin/magiskboot
        rm magisk.apk

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '10.28.2'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.x'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: Portable SVG verification
      shell: bash
      run: |
        set -euo pipefail
        node --check webui/icons.js
        node --check webui/page/kpm.js
        node --check webui/page/patch.js
        node --check webui/index.js
        node webui/tests/check-icons.mjs

    - name: build webroot
      run: |
        cd webui
        pnpm install --frozen-lockfile
        pnpm build

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.MODULE_NAME }}-${{ github.run_number }}
        path: 'module'

    - name: Check if valid to release
      id: check_tag
      run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "need_release=false" >> $GITHUB_OUTPUT
          else
            git fetch --tags
            VERSION="$(jq -r .version update.json)"
            if [ -z "$VERSION" ]; then
              echo "need_release=false" >> $GITHUB_OUTPUT
            elif git tag | grep -qx "^${VERSION}"; then
              echo "need_release=false" >> $GITHUB_OUTPUT
            else
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "need_release=true" >> $GITHUB_OUTPUT
            fi
          fi

  release:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.check_tag == 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 2

    - name: Download artifact
      uses: actions/download-artifact@v7
      with:
        name: ${{ env.MODULE_NAME }}-${{ github.run_number }}
        path: ${{ env.MODULE_NAME }}

    - name: Zip for release
      run: cd ${{ env.MODULE_NAME }} && zip -r ../${{ env.MODULE_NAME }}.zip .

    - name: Generate changelog
      run: |
        CHANGELOG_RAW=$(git diff HEAD^ HEAD -- "CHANGELOG.md" | grep '^+[^+]' | sed 's/^+//')
        {
          echo "CHANGELOG<<EOF"
          echo -e "${CHANGELOG_RAW}"
          echo "EOF"
        } >> $GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.build.outputs.version }}
        name: ${{ needs.build.outputs.version }}
        body: ${{ env.CHANGELOG }}
        files: ${{ env.MODULE_NAME }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
