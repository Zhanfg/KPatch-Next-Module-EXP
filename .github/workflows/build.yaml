name: Clean v0.0.9 UI + Nohello ABI build

on:
  push:
    branches:
      - main
      - rebuild/v0.0.9-ui-nohello-minimal
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module based on upstream v0.0.9
        uses: actions/checkout@v4

      - name: Verify unmodified upstream runtime logic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object webui/index.js)" = "ed8e86de564c2b978a75ee2b3bde3d24d35898f2"
          test "$(git hash-object webui/page/kpm.js)" = "ea8cf0d7c031524717379babedb76aeb2bf01427"
          test "$(git hash-object webui/page/patch.js)" = "1dc469accec499f294374600f92f55ba55796064"
          test "$(git hash-object webui/route.js)" = "31179747cc1214aa8671b28b12cc51ee559f9030"
          sh -n module/customize.sh
          ! grep -Fq 'Hot update webui' module/customize.sh
          grep -Fq "margin: auto !important" webui/styles.css
          grep -Fq "md-outlined-text-field:focus-within" webui/styles.css
          grep -Fq "versionCode=20" module/module.prop
          echo "Upstream UI logic unchanged; only UI CSS/SVG changed."

      - name: Checkout pinned ABI-fixed EXP core
        uses: actions/checkout@v4
        with:
          repository: Zhanfg/KPatch-Next-EXP
          ref: 8193f610d0105569437e17cc991459365dfa463a
          path: core
          submodules: recursive

      - name: Verify pinned EXP security patch and Nohello ABI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "8193f610d0105569437e17cc991459365dfa463a"
          python3 core/checks/check_kpm_data_hygiene.py
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -o /tmp/test_kpm_secure_wipe core/checks/test_kpm_secure_wipe.c
          /tmp/test_kpm_secure_wipe

      - name: Install aarch64 bare-metal compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/arm-toolchain.tar.xz \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          mkdir -p /tmp/kp-toolchain
          tar -xJf /tmp/arm-toolchain.tar.xz -C /tmp/kp-toolchain --strip-components=1
          echo 'TARGET_COMPILE=/tmp/kp-toolchain/bin/aarch64-none-elf-' >> "$GITHUB_ENV"

      - name: Compile patched kpimg and check Nohello ABI
        shell: bash
        run: |
          set -euo pipefail
          make -C core/kernel
          test -s core/kernel/kpimg
          /tmp/kp-toolchain/bin/aarch64-none-elf-nm -a core/kernel/kpimg.elf |
            grep -F '__kp_symbol_is_su_allow_uid'
          mkdir -p module/bin
          cp core/kernel/kpimg module/bin/kpimg
          printf 'KPIMG/source SHA: %s\n' "$(git -C core rev-parse HEAD)" > module/BUILD-PROVENANCE.txt
          printf '%s\n' 'Only Nohello legacy ABI export is patched in core; no KPM binary bundled.' >> module/BUILD-PROVENANCE.txt

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: android-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Compile matching Android kptools and kpatch
        shell: bash
        env:
          NDK_ROOT: ${{ steps.android-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make -C core/kernel hdr
          for tool in tools user; do
            cmake -S "core/$tool" -B "core/$tool/build/android" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_PLATFORM=android-33 -DANDROID_ABI=arm64-v8a
            cmake --build "core/$tool/build/android" -j 2
          done
          install -m 0755 core/tools/build/android/kptools module/bin/kptools
          install -m 0755 core/user/build/android/kpatch module/bin/kpatch
          sha256sum module/bin/kpimg module/bin/kptools module/bin/kpatch

      - name: Get Magiskboot v30.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v30.6 -R topjohnwu/Magisk -p 'Magisk*.apk' -O /tmp/magisk.apk
          unzip -p /tmp/magisk.apk 'lib/arm64-v8a/libmagiskboot.so' > module/bin/magiskboot
          test -s module/bin/magiskboot
          chmod 0755 module/bin/magiskboot

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Build original WebUI with minimal SVG/CSS patch
        shell: bash
        run: |
          set -euo pipefail
          node --check webui/index.js
          node --check webui/page/kpm.js
          node --check webui/page/patch.js
          node --check webui/route.js
          node --check webui/tests/nav-consistency.test.mjs
          node webui/tests/nav-consistency.test.mjs
          cd webui
          pnpm install --frozen-lockfile
          pnpm build
          test -s ../module/webroot/index.html

      - name: Verify staged module and create flashable-manager ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s module/module.prop
          test -s module/customize.sh
          test -s module/bin/kpimg
          test -s module/bin/kpatch
          test -s module/bin/kptools
          test -s module/bin/magiskboot
          test -s module/webroot/index.html
          grep -Fq 'versionCode=20' module/module.prop
          (cd module && zip -q -r ../KPatch-Next-EXP-CleanUI-Nohello-r1-hotfix2-security.zip .)
          unzip -t KPatch-Next-EXP-CleanUI-Nohello-r1-hotfix2-security.zip | tail -1
          sha256sum KPatch-Next-EXP-CleanUI-Nohello-r1-hotfix2-security.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KPatch-Next-EXP-CleanUI-Nohello-r1-hotfix2-security
          path: KPatch-Next-EXP-CleanUI-Nohello-r1-hotfix2-security.zip
          if-no-files-found: error
          retention-days: 30
